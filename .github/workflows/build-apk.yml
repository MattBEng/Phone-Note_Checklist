name: Build APK

on:
  push:
    branches: [ main ]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses and install required packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | sort -r | head -n1)
          if [ -z "$SDKMANAGER" ]; then
            echo "Could not find sdkmanager under $ANDROID_HOME" >&2
            find "$ANDROID_HOME" -maxdepth 4 >&2
            exit 1
          fi
          echo "Using sdkmanager at: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace -PversionCode=${{ github.run_number }}

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk checklist-debug.apk

      - name: Publish rolling release with the APK attached
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "v${{ github.run_number }} (${{ github.sha }})"
          body: |
            Automatic debug build from the latest push to `main`.
            Download `checklist-debug.apk` below, transfer it to your phone, and install it
            (you'll need to allow installs from this source once — see SETUP.md).
          files: checklist-debug.apk
          prerelease: true